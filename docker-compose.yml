networks:
  app-network:
    driver: bridge

volumes:
  launchpad_db_data:

services:

  # MYSQL DATABASE
  app-db:
    image: mysql:8.0
    container_name: launchpad_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - launchpad_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${DB_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # 1. AUTH SERVICE (Port 5001)
  auth-service:
    build:
      context: ./Service/authService
      dockerfile: Dockerfile
    container_name: auth_microservice
    restart: always
    ports:
      - "${AUTH_PORT}:5001"
    environment:
      PORT: 5001
      SERVICE_NAME: auth-service
      CLIENT_ORIGIN: http://localhost:3000      
      DB_HOST: app-db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - app-network

  # 2. RESTAURANT SERVICE (Port 5002)  
  restaurant-service:
    build:
      context: ./Service/restaurantService
      dockerfile: Dockerfile
    container_name: restaurant_microservice
    restart: always
    ports:
      - "${RESTAURANT_PORT}:5002"
    environment:
      PORT: 5002
      SERVICE_NAME: restaurant-service
      CLIENT_ORIGIN: http://localhost:3000
      DB_HOST: app-db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - app-network

  # 3. ORDER SERVICE (Port 5003)
  order-service:
    build:
      context: ./Service/orderService
      dockerfile: Dockerfile
    container_name: order_microservice
    restart: always
    ports:
      - "${ORDER_PORT}:5003"
    environment:
      PORT: 5003
      SERVICE_NAME: order-service
      CLIENT_ORIGIN: http://localhost:3000
      DB_HOST: app-db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - app-network

  # 4. DELIVERY SERVICE (Port 5004)
  delivery-service:
    build:
      context: ./Service/deliveryService
      dockerfile: Dockerfile
    container_name: delivery_microservice
    restart: always
    ports:
      - "${DELIVERY_PORT}:5004"
    environment:
      PORT: 5004
      SERVICE_NAME: delivery-service
      CLIENT_ORIGIN: http://localhost:3000
      DB_HOST: app-db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ORDER_SERVICE_URL: http://order-service:5003
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - app-network

  # 5. CUSTOMER SERVICE (Port 5005)
  customer-service:
    build:
      context: ./Service/customerService
      dockerfile: Dockerfile
    container_name: customer_microservice
    restart: always
    ports:
      - "${CUSTOMER_PORT}:5005"
    environment:
      PORT: 5005
      SERVICE_NAME: customer-service
      CLIENT_ORIGIN: http://localhost:3000
      DB_HOST: app-db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - app-network

  # 6. REACT FRONTEND (Port 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_URL: http://localhost:5001/api/auth
        VITE_RESTAURANT_API_URL: http://localhost:5002/api
        VITE_ORDER_API_URL: http://localhost:5003/api/orders
        VITE_DELIVERY_API_URL: http://localhost:5004/api/deliveries
        VITE_CUSTOMER_API_URL: http://localhost:5005/api/customers
    container_name: food-delivery-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - delivery-service
      - customer-service
    networks:
      - app-network